<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2f7d32">
<title>Connexion | Niougal Ma</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="auth.css">
</head>
<body>
<main class="auth-page">
<a href="index.html" class="auth-logo">🥬 <span>Niougal Ma</span></a>
<section class="auth-card">
<div class="auth-illustration">👋</div>
<h1>Bon retour !</h1>
<p>Connectez-vous pour retrouver vos commandes.</p>
<form id="loginForm">
<label for="loginPhone">Numéro de téléphone</label>
<input id="loginPhone" type="tel" placeholder="77 000 00 00" required>
<label for="loginPassword">Mot de passe</label>
<div class="password-wrap"><input id="loginPassword" type="password" placeholder="Votre mot de passe" required><button type="button" class="show-password">👁️</button></div>
<button class="auth-btn" type="submit">Se connecter →</button>
</form>
<p class="auth-switch">Vous n'avez pas encore de compte ? <a href="inscription.html">Créer un compte</a></p>
<a class="back-home" href="index.html">← Retour à l'accueil</a>
</section>
</main>
<div class="toast" id="toast"></div>
<script src="auth.js"></script>
</body>
</html>
